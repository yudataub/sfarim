<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>קטלוג המדבקות החכם</title>
<style>
:root{--bg:#f4f1e8;--paper:#fffdf8;--ink:#17211b;--muted:#68736b;--line:#d9ddd5;--green:#1f6848;--green2:#dfeee5;--gold:#d49a2a;--rust:#b85838;--shadow:0 12px 35px rgba(28,45,35,.09)}
@media(prefers-color-scheme:dark){:root{--bg:#111713;--paper:#1a211c;--ink:#edf3ee;--muted:#a4aea7;--line:#303b34;--green:#76c79e;--green2:#20372b;--gold:#e0ad4d;--rust:#e07d5d;--shadow:0 12px 35px rgba(0,0,0,.28)}}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(circle at 12% 0,rgba(212,154,42,.12),transparent 28rem),var(--bg);color:var(--ink);font:15px/1.5 "Noto Sans Hebrew","Segoe UI",sans-serif}
button,input,select,textarea{font:inherit}button,select{cursor:pointer}header{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 93%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.head{max-width:1500px;margin:auto;padding:15px 20px 12px}.titleline{display:flex;justify-content:space-between;gap:16px;align-items:end}.eyebrow{color:var(--rust);font-weight:800;font-size:12px;letter-spacing:.08em}.title{margin:0;font-size:clamp(24px,3vw,38px);line-height:1.1;font-family:"Noto Serif Hebrew",David,serif}.sum{color:var(--muted);font-size:13px;white-space:nowrap}
.searchrow{display:grid;grid-template-columns:minmax(240px,1fr) auto;gap:10px;margin-top:14px}.searchbox{position:relative}.searchbox input{width:100%;border:1px solid var(--line);border-radius:16px;background:var(--paper);color:var(--ink);padding:12px 44px 12px 14px;outline:none;box-shadow:0 4px 16px rgba(20,40,30,.05)}.searchbox input:focus{border-color:var(--green);box-shadow:0 0 0 3px color-mix(in srgb,var(--green) 18%,transparent)}.searchicon{position:absolute;right:15px;top:10px;font-size:20px;color:var(--green)}
.filtertoggle{border:1px solid var(--green);color:var(--green);background:var(--green2);border-radius:14px;padding:0 16px;font-weight:800}.filters{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;align-items:center}.filters select,.ghost{border:1px solid var(--line);border-radius:999px;background:var(--paper);color:var(--ink);padding:7px 12px}.ghost{font-weight:700}.ghost:hover{border-color:var(--green)}.activefilters{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.activefilters:empty{display:none}.pill{border:0;background:var(--green);color:#fff;border-radius:999px;padding:5px 10px}.pill::after{content:" ×"}
.ideas{display:flex;gap:7px;overflow:auto;padding:10px 0 2px;scrollbar-width:thin}.idea{white-space:nowrap;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:999px;padding:6px 11px}.idea.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
main{max-width:1500px;margin:auto;padding:18px 20px 56px}.section{margin:0 0 28px}.sectionhead{display:flex;align-items:center;gap:9px;margin:0 0 10px;position:sticky;top:178px;z-index:4;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);padding:7px 2px}.sectionhead h2{font:800 18px/1.2 "Noto Serif Hebrew",David,serif;margin:0}.count{font-size:12px;color:var(--muted);background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:2px 8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:11px}.tile{position:relative;background:var(--paper);border:1px solid var(--line);border-radius:18px;aspect-ratio:1;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:9px;transition:.18s ease;box-shadow:0 4px 14px rgba(31,60,45,.035);overflow:hidden}.tile:hover{transform:translateY(-4px) rotate(-.4deg);border-color:var(--green);box-shadow:var(--shadow)}.tile:focus-visible{outline:3px solid var(--gold);outline-offset:2px}.tile img{max-width:100%;max-height:100%;object-fit:contain}.badge,.anim,.topicbadge{position:absolute;font-size:10px;border-radius:999px;padding:2px 7px;max-width:72%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.badge{bottom:6px;left:7px;color:var(--muted);background:var(--bg)}.anim{top:6px;left:7px;background:var(--green2);color:var(--green)}.topicbadge{bottom:6px;right:7px;color:#fff;background:var(--rust)}
.empty{text-align:center;color:var(--muted);padding:70px 20px}.empty strong{display:block;color:var(--ink);font-size:22px;margin-bottom:5px}.empty button{margin-top:14px;border:0;border-radius:12px;padding:9px 16px;background:var(--green);color:#fff}
dialog{border:0;border-radius:24px;padding:0;background:var(--paper);color:var(--ink);max-width:min(94vw,560px);width:100%;box-shadow:0 30px 90px rgba(0,0,0,.35)}dialog::backdrop{background:rgba(7,18,12,.62);backdrop-filter:blur(3px)}.big{background:repeating-conic-gradient(color-mix(in srgb,var(--line) 55%,transparent) 0 25%,transparent 0 50%) 0 0/20px 20px;display:flex;justify-content:center;padding:22px;min-height:220px}.big img{max-width:100%;max-height:46vh}.panel{padding:16px 18px}.info{font-size:13px;display:grid;grid-template-columns:1fr 1fr;gap:6px 18px}.info div{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line);padding:5px 0}.info span:first-child{color:var(--muted)}.tagtitle{font-weight:800;margin:16px 0 7px}.tagchips{display:flex;gap:6px;flex-wrap:wrap}.tagchip{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:5px 10px}.tagchip.on{background:var(--green);color:#fff;border-color:var(--green)}textarea{width:100%;min-height:58px;resize:vertical;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);padding:8px;margin-top:8px}.acts{display:flex;gap:8px;margin-top:14px}.acts a,.acts button{flex:1;text-align:center;border:1px solid var(--line);border-radius:12px;padding:9px;background:var(--bg);color:var(--ink);text-decoration:none}.acts .pri{background:var(--green);color:#fff;border-color:var(--green)}
.help{position:fixed;left:18px;bottom:18px;z-index:6;border:0;border-radius:50%;width:44px;height:44px;background:var(--gold);color:#261a05;font-weight:900;box-shadow:var(--shadow)}
@media(max-width:700px){.head,main{padding-inline:12px}.titleline{align-items:start}.sum{white-space:normal;text-align:left}.filters[hidden]{display:none}.filters{display:grid;grid-template-columns:1fr 1fr}.filters select,.ghost{width:100%}.grid{grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}.sectionhead{top:192px}.info{grid-template-columns:1fr}.acts{flex-wrap:wrap}.acts>*{min-width:40%}}
</style>
</head>

<header><div class="head">
  <div class="titleline"><div><div class="eyebrow">המדבקות שלך, מסודרות</div><h1 class="title">קטלוג מדבקות חכם</h1></div><div class="sum" id="sum" aria-live="polite"></div></div>
  <div class="searchrow"><label class="searchbox"><span class="searchicon">⌕</span><input id="search" type="search" autocomplete="off" placeholder="חיפוש לפי אירוע, נושא, רעיון, תאריך או מזהה…" aria-label="חיפוש במדבקות"></label><button class="filtertoggle" id="filtertoggle">סינון</button></div>
  <div class="filters" id="filters">

    <select id="phone" aria-label="טלפון"><option value="">שני הטלפונים</option><option value="055">טלפון 055</option><option value="052">טלפון 052</option><option value="both">נמצאות בשניהם</option></select>
    <select id="kind" aria-label="סוג"><option value="">כל הסוגים</option><option value="a">מונפשות</option><option value="s">סטטיות</option></select>
    <select id="sort" aria-label="מיון"><option value="n">הכי שימושיות</option><option value="new">חדשות קודם</option><option value="old">ישנות קודם</option><option value="kb">הכי כבדות</option><option value="topic">לפי נושא</option></select>
    <select id="view" aria-label="תצוגה"><option value="flat">תצוגה רציפה</option><option value="groups">קבוצות לפי נושא</option></select>
    <button class="ghost" id="clear">ניקוי סינון</button>
  </div>
  <div class="activefilters" id="activefilters"></div>
  <div class="ideas" id="ideas" aria-label="רעיונות לסינון"></div>
</div></header>
<main id="content"><div class="empty" id="empty" hidden><strong>לא מצאתי מדבקות מתאימות</strong><span>אפשר לשנות את החיפוש או לנקות את הסינון.</span><br><button id="emptyclear">ניקוי הכול</button></div></main>
<dialog id="dlg"><div class="big"><img id="dimg" alt=""></div><div class="panel"><div class="info" id="dinfo"></div><div class="tagtitle">תיוג אישי — לחצו על כל הנושאים המתאימים</div><div class="tagchips" id="tagchips"></div><textarea id="note" placeholder="הערה או מילות חיפוש משלך…" aria-label="הערה אישית"></textarea><div class="acts"><a id="ddl" class="pri" download>הורדה</a><button id="dcopy">העתקה</button><button id="dclose">שמירה וסגירה</button></div></div></dialog>
<button class="help" id="help" title="איך מסדרים מדבקות?">?</button>
