<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ספרי יהודה טאוב</title>
<style>
 *{box-sizing:border-box}
 body{font-family:"Segoe UI",Arial,sans-serif;background:#f7f8fa;color:#16181d;
      margin:0;padding:28px 16px;line-height:1.5}
 .wrap{max-width:820px;margin:0 auto}
 h1{font-size:27px;margin:0 0 6px}
 .sub{color:#6b7280;font-size:14px;margin-bottom:22px}
 #q{width:100%;padding:11px 14px;font-size:15px;border:1px solid #dcdfe4;
    border-radius:9px;margin-bottom:18px;background:#fff}
 .item{display:block;background:#fff;border:1px solid #e4e6ea;border-radius:10px;
       padding:14px 16px;margin-bottom:10px;text-decoration:none;color:inherit;
       transition:.12s}
 .item:hover{border-color:#2563eb;box-shadow:0 2px 10px rgba(37,99,235,.10)}
 .t{font-weight:600;font-size:16px;word-break:break-word}
 .m{color:#8b909a;font-size:12.5px;margin-top:3px}
 .new{background:#16a34a;color:#fff;font-size:10.5px;font-weight:700;
      border-radius:5px;padding:2px 7px;margin-inline-start:8px;vertical-align:middle}
 .ic{margin-inline-end:7px}
 .empty{color:#8b909a}
 footer{margin-top:26px;color:#9aa0a6;font-size:12px;text-align:center}
</style></head><body><div class="wrap">
<h1>ספרי יהודה טאוב</h1>
<div class="sub">0 פריטים · עודכן 2026-09-22 19:43 · הפריטים החדשים ביותר למעלה</div>
<input id="q" placeholder="חיפוש..." oninput="flt()">
<div id="list">
<p class="empty">עדיין אין קבצים.</p>
</div>
<footer>מתעדכן אוטומטית</footer>
</div>
<script>
function flt(){
  var v=document.getElementById('q').value.trim().toLowerCase();
  document.querySelectorAll('#list .item').forEach(function(e){
    e.style.display = e.textContent.toLowerCase().indexOf(v)>-1 ? '' : 'none';
  });
}
</script>
</body></html>
